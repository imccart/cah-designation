# Numeric claim provenance for "Survival versus Scale: The Effects of Critical
# Access Hospital Designation." Audited by /review-numbers.
#
# SCOPE. One entry per numeric quantity reported in the prose of paper/paper.tex
# (including the abstract) and paper/appendix.tex. Confidence intervals ride along
# in the `claim` string and are audited through their point estimate, since both
# come from the same table row. Table and figure cells are not entered separately:
# they are the artifacts, and checking a generated table against its own generator
# is circular.
#
# Deliberately excluded, since none of them come out of the pipeline:
#   - statutory and institutional facts (101 percent of costs, the 25-bed limit,
#     96-hour average length of stay, 35 and 15 mile distance rules, 2006 and 2007
#     rule changes, the 2023 REH designation)
#   - estimation constants readable from the scripts (500 permutation draws,
#     10,000 Monte Carlo draws, 150 bootstrap replications, winsorization at the
#     5th and 95th percentiles, the 85 percent occupancy cap, constant 2010
#     dollars, the 50-bed sample cutoff, pre- and post-period lengths)
#
# STATUS CONVENTIONS USED HERE.
#   - A blank `artifact` marks a claim with no persisted source. The audit returns
#     FAIL ("artifact missing") for these by design; the `explanation` names the
#     script and the object that would have to be written out to close it.
#   - EXPLAINED marks a number taken from a cited paper rather than from this
#     pipeline. The `explanation` carries the citation.
#   - `artifact_key` uses row/col on single-keyed CSVs and a regex elsewhere,
#     including on CSVs whose rows need more than one field to identify.
#
# SECTIONS. Claims are grouped by document and each carries a `document` field
# (paper or appendix). Ids are prefixed the same way: abstract-/sec* for
# paper/paper.tex and app* for paper/appendix.tex.
#
# The response letter has its own passport at
# paper/submissions/jpube/resubmission/passport.yaml. That folder is gitignored,
# so numbers quoted only to the referees stay out of the public repo. Its paths
# are written relative to the project root, like this file's.

